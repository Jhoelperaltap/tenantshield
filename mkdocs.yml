site_name: TenantShield
site_description: Multi-tenant enforcement engine for Python
repo_url: https://github.com/jhoelperaltap/tenantshield
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            docstring_style: google

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts/index.md
  - API Reference: api/index.md
  - Adapters: adapters/index.md
  - Observability:
    - Quick Start: observability/quick-start.md
    - Dual-Pattern: observability/dual-pattern.md
    - Async Middleware Migration: observability/async-middleware-migration.md
    - Production Checklist: observability/production-checklist.md
    - Integration:
      - OpenTelemetry: observability/integration/opentelemetry.md
      - Prometheus: observability/integration/prometheus.md
  - ADRs:
    - "0001 - Commit signing deferral": adr/0001-commit-signing-deferral.md
    - "0002 - Django 6.0 deferral": adr/0002-django-6-deferral.md
    - "0003 - Django 4.2 empirical support": adr/0003-django-4-2-empirical-support.md
    - "0004 - DRF stubs empirical support": adr/0004-drf-stubs-empirical-support.md
    - "0005 - Tight upper bounds strategy": adr/0005-tight-upper-bounds-strategy.md
    - "0006 - SQLAlchemy 2.0 only": adr/0006-sqlalchemy-2-0-only.md
    - "0007 - Event-based enforcement (SQLAlchemy)": adr/0007-event-based-enforcement.md
    - "0008 - Middleware lifecycle design (SQLAlchemy)": adr/0008-middleware-lifecycle-design.md
    - "0011 - Observability architecture": adr/0011-observability-architecture.md
    - "0012 - Audit-observability dual-pattern": adr/0012-audit-dual-pattern.md
    - "0013 - Three-mode read/write semantics": adr/0013-three-mode-read-write-semantics.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
