name: Feature request
description: Propose a new feature or enhancement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user-facing problem or limitation this feature addresses.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution or API sketch
      description: A rough proposal. Code snippets or API shapes welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they were not chosen.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Core engine
        - Django adapter
        - SQLAlchemy adapter
        - Celery adapter
        - DRF integration
        - Tooling / CI
        - Documentation
    validations:
      required: true
