[project]
name = "tenantshield-example-cli"
version = "0.1.0"
description = "Framework-agnostic CLI example demonstrating TenantShield SQLAlchemy adapter."
requires-python = ">=3.11"
dependencies = [
    "tenantshield[sqlalchemy] @ file://${PROJECT_ROOT}/../../..",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "seed", "models"]

[tool.pytest.ini_options]
# Override root project pytest config inheritance. The example does NOT
# participate in tenantshield library coverage measurement; tests here
# validate the example end-to-end, not library internals.
addopts = "-ra -q"
testpaths = ["tests"]
