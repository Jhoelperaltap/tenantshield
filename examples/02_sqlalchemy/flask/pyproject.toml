[project]
name = "tenantshield-example-flask"
version = "0.1.0"
description = "Runnable Flask example demonstrating TenantShield SQLAlchemy adapter."
requires-python = ">=3.11"
dependencies = [
    "tenantshield[sqlalchemy] @ file://${PROJECT_ROOT}/../../..",
    "flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "models"]
