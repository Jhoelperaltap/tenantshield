[project]
name = "tenantshield-example-fastapi"
version = "0.1.0"
description = "Runnable FastAPI example demonstrating TenantShield SQLAlchemy adapter."
requires-python = ">=3.11"
dependencies = [
    "tenantshield[sqlalchemy] @ file://${PROJECT_ROOT}/../../..",
    "fastapi>=0.110,<2.0",
    "uvicorn>=0.27,<1.0",
    "aiosqlite>=0.22,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "models"]

[tool.pytest.ini_options]
# Override root project pytest config inheritance. The example does NOT
# participate in tenantshield library coverage measurement; tests here
# validate the example end-to-end, not library internals.
addopts = "-ra -q"
asyncio_mode = "strict"
testpaths = ["tests"]
